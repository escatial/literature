[project]
name = "lit-review-agent-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "openai>=1.40",
    "langchain-core>=0.3",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "urllib3>=2.0",
    "lxml>=5.0",
    "PyYAML>=6.0",
    "pycryptodome>=3.19",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call real external services",
]
