# ============================================================================
# 中国知网爬虫配置文件（嵌入项目内：backend/src/automation/cnki/config.yaml）
# ============================================================================
# 优先级：命令行参数 > 环境变量 > 本文件 > 代码内置默认
# 修改后重启后端生效（或调用 automation.cnki.crawler.init() 热重载）
# ============================================================================

# ---------- 超级鹰（验证码识别平台）----------
# 安全建议：账号/密码/soft_id 优先用环境变量注入（CJY_USER / CJY_PASS / CJY_SOFT_ID），
#           避免明文落盘。此处留空则必须配置环境变量，否则启动会报错。
chaojiying:
  user: ""
  pass: ""
  soft_id: ""
  # 验证码类型：1902=英数混合 9902=滑块 9901=单图形块 1005=1~5位英文数字
  # 注意：运行时由 CaptchaDispatcher 按场景自动选型并降级，此值仅作兜底
  #   slider → 9902(两图形块) → 9900(缺口定位) → 9602(水平拼图)
  #   alnum  → 1005(1~5位英数) → 1902(4~6位英数) → 1004(1~4位英数)
  #   point  → 9004(1~4坐标) → 9006(1~6坐标) → 9101(固定1坐标)
  codetype: 9902

# ---------- 知网签名（如果哪天改了，改这里）----------
# 也可用环境变量覆盖：CNKI_SIGN_APP_ID / CNKI_SIGN_SECRET
sign:
  app_id: "LoginWap"
  secret: ""

# ---------- 知网接口地址 ----------
endpoints:
  base: "https://kns.cnki.net"
  search: "https://kns.cnki.net/kns8s/brief/grid"
  adv_search: "https://kns.cnki.net/kns8s/AdvSearch"
  verify_api: "https://kns.cnki.net/verify-api/web"
  verify_home: "https://kns.cnki.net/verify/home"

# ---------- HTTP 客户端伪装 ----------
http:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36"
  sec_ch_ua: '"Not=A?Brand";v="99", "Google Chrome";v="151", "Chromium";v="151"'
  sec_ch_ua_platform: '"Windows"'
  sec_ch_ua_mobile: "?0"
  accept_language: "zh-CN,zh;q=0.9"
  uniplatform: "NZKPT"
  timeout: 20
  # 是否信任系统代理(Windows Internet 设置,常见 Clash 127.0.0.1:7890)。
  # 知网为国内站应直连;若经代理节点的出口证书与 kns.cnki.net 不匹配,
  # 会出现 TLS "Hostname mismatch" 间歇性失败(如第 42 篇起连续失败)。
  # 如需强制走代理,置为 true 并在系统设置里开启代理即可。
  trust_env: false
  # 翻页 token：会话绑定，可能随 cookie 失效而变化（运行时优先从高级检索页自动提取）
  turnpage: "8Kf6r96aVUubfe4hUZXU-w%21%21"
  # ---------- 浏览器指纹随机化（会话级）----------
  # enabled=true: 每次进程启动从内置指纹池随机挑一份(UA↔sec-ch-ua 严格配对,
  #   含 Chrome/Edge/Firefox 桌面端),整个会话保持一致(会话中途换 UA 本身就是风控信号)
  # enabled=false: 全程用上面的固定指纹(行为与旧版一致)
  # pool: 追加自定义指纹(诊断某指纹被拉黑时从内置池下架、从这里上架),条目格式:
  #   - {name: chrome134-win, user_agent: "Mozilla/5.0 ...", sec_ch_ua: '...', sec_ch_ua_platform: '"Windows"', sec_ch_ua_mobile: "?0"}
  fingerprint:
    enabled: true
    pool: []

# ---------- 稳定性：分层重试 + 断路器 + 告警推送 ----------
resilience:
  breaker:
    # HTTP 断路器：连续失败达阈值熔断(拒绝发请求,防无效流量堆积),
    # 冷却 recovery_timeout 秒后放行单个探测请求,成功恢复、失败重新熔断
    failure_threshold: 5
    recovery_timeout: 60.0
  retry:
    # 分层重试(仅 HTTP 层:超时/连接错误/状态码)：
    #   TRANSIENT(网络波动/5xx)  短退避快速重试 transient_backoff 秒
    #   RATE_LIMITED(429/503)    长退避跨知网限流窗口 rate_limited_backoff 秒
    #   BLOCKED(风控/cookie失效) 不重试——由 cookie 自愈/代理切换处置
    #   FATAL(业务致命)          不重试——立即上抛
    # 退避含 ±jitter 抖动,打散多任务重试同步性
    transient_retries: 3
    rate_limited_retries: 2
    transient_backoff: [1.0, 2.0, 4.0]
    rate_limited_backoff: [15.0, 45.0]
    jitter: 0.2
  # 告警中心：同类告警 cooldown 秒内节流合并(count 累加);
  # 推送目标读环境变量 CNKI_ALERT_WEBHOOK_URL(POST JSON),未配置则仅落内存缓冲(面板可查)
  alert_cooldown: 300.0

# ---------- 代理 IP 池（反爬应对）----------
# mode:
#   off      直连(默认,行为与旧版一致)
#   on       所有请求走池内代理(按健康分加权轮换)
#   failover 平时直连;直连请求失败重试时自动切代理出口
# 池来源:下方 pool 列表 + 环境变量 CNKI_PROXY_LIST(逗号分隔),自动去重合并
# 健康管理:mode=on 时后台线程按 check_interval 巡检;成功+5分/失败-10分,
#   连续失败3次冷却 cooldown 秒;跌破 score_threshold 剔除轮换(保留观测)
proxy:
  mode: "off"
  pool: []
  check_url: "https://kns.cnki.net/kns8s/AdvSearch"
  check_timeout: 8.0
  check_interval: 300.0
  cooldown: 600.0
  score_threshold: 0.0

# ---------- 检索默认值 ----------
search:
  default_field: "SU"             # SU=主题 TI=题名 KY=关键词 AU=作者 AB=摘要
  default_operator: "TOPRANK"     # TOPRANK=模糊 EQ=精确
  default_resource: "CAPJ"        # CAPJ=期刊 CAPM=博硕 CAJD=会议 CCND=报纸 CROSSDB=总库
  page_size: 20
  max_per_keyword: 20

# ---------- 资源代码 → (KuaKuCode, 默认 Classid) ----------
resource_map:
  CAPJ:    ["YSTT4HG0,LSTPFY1C,EMRPGLPA,JUP3MUPD,MPMFIG1A,WQ0UVIAA,BLZOG7CK,PWFIRAGL,NN3FJMUV,NLBO1Z6R", "WD0FTY92"]
  CAPM:    ["CDMD,CDMDL", "WD0FTY92"]
  CAJD:    ["CPFD", "WD0FTY92"]
  CCND:    ["CCND", "WD0FTY92"]
  CIBD:    ["CIPD", "WD0FTY92"]
  CROSSDB: ["YSTT4HG0,LSTPFY1C,EMRPGLPA,JUP3MUPD,MPMFIG1A,WQ0UVIAA,BLZOG7CK,PWFIRAGL,NN3FJMUV,NLBO1Z6R", "WD0FTY92"]

# ---------- 检索字段说明（仅注释） ----------
# SU = 主题   TI = 题名   KY = 关键词   AB = 摘要   AU = 作者
# FI = 第一作者   RF = 参考文献

# ---------- 运行控制 ----------
runtime:
  # 基础请求间隔(秒):过低会触发知网限流/风控
  delay_seconds: 2.0
  retry_times: 3
  progress_bar_width: 30
  # 动态并发池边界:抓详情页的线程数在 [min_workers, max_workers] 区间内
  # 按实时负载(响应延迟/失败率/风控信号/本机CPU)自适应调节——
  # 站点顺畅提速、迎风减速到1线程,兼顾效率与目标站保护
  min_workers: 1
  max_workers: 6

# ---------- 文件路径（嵌入后运行时文件统一落到本包 data/ 目录）----------
paths:
  cookies_file: "cookies.json"
  config_file: "config.yaml"
  captcha_back_image: "captcha_back.jpg"
  debug_abstract_html: "debug_abstract.html"
  failed_file: "failed.json"
  default_output_prefix: "result"
